<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login - CodeLink</title>
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body class="auth-screen">
  <div class="auth-container">
    <div class="auth-card glass-card">
      <div class="auth-header">
        <h1>Admin Login</h1>
        <p>Sign in with an admin account to access the dashboard</p>
      </div>

      <form id="admin-login-form" class="form-stack">
        <input id="admin-email" type="email" placeholder="Admin email" required />
        <input id="admin-password" type="password" placeholder="Password" required />
        <button type="submit" class="btn accent">Sign In as Admin</button>
        <p class="small">After successful login you'll be redirected to the Admin Panel.</p>
        <p class="switch">Back to <a href="login.html">User Login</a></p>
      </form>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="../js/admin-login.js"></script>
</body>
</html>
