<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeLink - Live Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/playground.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
</head>
<body class="workspace-screen scene-grid">
  <div class="cinematic-media" aria-hidden="true">
    <video class="cinematic-video" autoplay muted loop playsinline preload="metadata">
      <source src="https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4" type="video/mp4" />
    </video>
    <div class="cinematic-image"></div>
    <div class="cinematic-vignette"></div>
    <div class="cinematic-noise"></div>
  </div>
  <header class="topbar">
    <button id="menu-btn">MENU</button>
    <h2>Live Playground</h2>
  </header>

  <div class="dashboard-layout">
    <aside id="sidebar" class="sidebar">
      <header class="brand">
        <h1>CodeLink</h1>
        <p>Workspace</p>
      </header>

      <nav class="nav-links">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="playground.html" class="nav-link active">Playground</a>
        <a href="snippets.html" class="nav-link">Snippets</a>
        <a href="forum.html" class="nav-link">Forum</a>
        <a href="matchmaker.html" class="nav-link">Matchmaker</a>
        <a href="cheatsheet.html" class="nav-link">Cheat Sheet</a>
      </nav>

      <div class="sidebar-footer">
        <button id="theme-toggle-button" class="btn secondary">Switch Theme</button>
        <button id="logout-button" class="btn secondary">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <section class="playground-container">
        <div class="page-title">
          <h2>Live Code Playground</h2>
          <p>Write, run, and preview instantly.</p>
        </div>

        <div class="editor-grid">
          <div class="editor-box">
            <h3>HTML</h3>
            <textarea id="html-editor"></textarea>
          </div>
          <div class="editor-box">
            <h3>CSS</h3>
            <textarea id="css-editor"></textarea>
          </div>
          <div class="editor-box">
            <h3>JavaScript</h3>
            <textarea id="js-editor"></textarea>
          </div>
        </div>

        <div class="editor-actions">
          <button id="run-code" class="btn accent">Run Code</button>
          <button id="fullscreen-preview" class="btn secondary" type="button">Fullscreen</button>
        </div>

        <div class="preview-panel">
          <iframe id="preview-frame"></iframe>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script type="module" src="../js/playground.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('menu-btn');
      const sidebar = document.getElementById('sidebar');
      if (btn && sidebar) {
        btn.onclick = () => sidebar.classList.toggle('active');
      }
    });
  </script>
</body>
</html>
